<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Globe Viewer (Orthographic)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: sans-serif; }
        canvas { display: block; }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            pointer-events: none;
            user-select: none;
            z-index: 5;
        }

        .upload-btn {
            background-color: #ffffff;
            color: #333;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.2s;
            text-align: center;
        }

        .upload-btn:hover {
            background-color: #e0e0e0;
        }

        #fileInput { display: none; }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="info">Left Click to Rotate &bull; Scroll to Zoom (Scale) &bull; Right Click to Pan</div>

    <div id="ui-container">
        <label for="fileInput" class="upload-btn">📂 Upload Your Own Map</label>
        <input type="file" id="fileInput" accept="image/jpeg, image/png, image/jpg">
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Standard Setup ---
        const scene = new THREE.Scene();

        // 1. CHANGE: ORTHOGRAPHIC CAMERA SETUP
        // Frustum size determines how much of the scene is visible at zoom level 1
        const frustumSize = 12;
        const aspect = window.innerWidth / window.innerHeight;

        const camera = new THREE.OrthographicCamera(
            frustumSize * aspect / -2,  // left
            frustumSize * aspect / 2,   // right
            frustumSize / 2,            // top
            frustumSize / -2,           // bottom
            0.1,                        // near
            1000                        // far
        );

        // Move camera back (Z-axis) so it sees the object, but distance doesn't affect size anymore
        camera.position.z = 20;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- Sphere Setup ---
        const geometry = new THREE.SphereGeometry(5, 64, 32);
        const textureLoader = new THREE.TextureLoader();

        let currentTexture = textureLoader.load('./maps/world.topo.bathy.200406.3x10800x5400_blue-green-yellow_lighter.jpg');
        currentTexture.colorSpace = THREE.SRGBColorSpace;

        const material = new THREE.MeshBasicMaterial({ map: currentTexture });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        // --- Controls ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 2. CHANGE: ZOOM SETTINGS
        // For Orthographic, zoom is a multiplier (1 = 100%, 2 = 200%)
        controls.minZoom = 0.5; // Allow zooming out a bit
        controls.maxZoom = 5;   // Allow zooming in 5x

        // --- Upload Logic (Same as before) ---
        const fileInput = document.getElementById('fileInput');
        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const objectURL = URL.createObjectURL(file);
                textureLoader.load(objectURL, (newTexture) => {
                    newTexture.colorSpace = THREE.SRGBColorSpace;
                    if (sphere.material.map) sphere.material.map.dispose();
                    sphere.material.map = newTexture;
                    sphere.material.needsUpdate = true;
                });
            }
        });

        // --- Resize Logic (Updated for Orthographic) ---
        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;

            // We must update the left/right/top/bottom boundaries on resize
            camera.left = -frustumSize * aspect / 2;
            camera.right = frustumSize * aspect / 2;
            camera.top = frustumSize / 2;
            camera.bottom = -frustumSize / 2;

            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
