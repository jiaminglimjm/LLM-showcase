<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Globe (Google Earth Style)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        canvas { display: block; }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        #info {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
            user-select: none;
            font-size: 12px;
        }

        .upload-btn {
            background-color: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            border: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: all 0.2s;
            display: inline-block;
        }

        .upload-btn:hover {
            background-color: #fff;
            transform: scale(1.05);
        }

        #fileInput { display: none; }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="info">Left Click: Rotate &bull; Scroll: Zoom</div>

    <div id="ui-container">
        <label for="fileInput" class="upload-btn">📂 Upload Map Image</label>
        <input type="file" id="fileInput" accept="image/jpeg, image/png, image/jpg">
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Scene Setup ---
        const scene = new THREE.Scene();

        // 1. CHANGE: PerspectiveCamera with Narrower FOV
        // FOV 45 is closer to how human eyes/standard cameras see objects at a distance.
        // It reduces the "fisheye" distortion found in the previous code (which was 75).
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 18;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        // Better color accuracy for photos
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        // --- Sphere Setup ---
        const geometry = new THREE.SphereGeometry(5, 64, 32);
        const textureLoader = new THREE.TextureLoader();

        let currentTexture = textureLoader.load('./maps/world.topo.bathy.200406.3x10800x5400_blue-green-yellow_lighter.jpg');
        currentTexture.colorSpace = THREE.SRGBColorSpace;

        const material = new THREE.MeshBasicMaterial({ map: currentTexture });
        const sphere = new THREE.Mesh(geometry, material);
        scene.add(sphere);

        // --- Controls (Google Earth Style) ---
        const controls = new OrbitControls(camera, renderer.domElement);

        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 2. CHANGE: Disable Panning
        // This ensures the globe stays perfectly centered, just like Google Earth.
        // You cannot accidentally "drag" the globe off the screen.
        controls.enablePan = false;

        controls.enableZoom = true;

        // 3. CHANGE: Zoom Limits
        // minDistance: Stops you just before you crash into the surface (Radius is 5)
        controls.minDistance = 5.5;
        controls.maxDistance = 50;

        // --- Upload Logic ---
        const fileInput = document.getElementById('fileInput');
        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const objectURL = URL.createObjectURL(file);
                textureLoader.load(objectURL, (newTexture) => {
                    newTexture.colorSpace = THREE.SRGBColorSpace;
                    if (sphere.material.map) sphere.material.map.dispose();
                    sphere.material.map = newTexture;
                    sphere.material.needsUpdate = true;
                });
            }
        });

        // --- Resize Logic ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
